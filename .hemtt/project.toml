# HOSTIS is a modified version of LAMBS Danger.fsm. PBOs, keys and the release zip are
# named hostis_*. The compatibility addons (main, danger, wp, eventhandlers, formations,
# range) keep their z\lambs\addons\* $PBOPREFIX$ and lambs_* script prefix so existing
# missions keep working. HEMTT therefore prints six INVALID-PBOPREFIX warnings on every
# build; they are expected (docs/adr/0002-fork-identity-and-addon-naming.md).
name = "HOSTIS"
prefix = "hostis"
author = "bluefield-creator (fork of LAMBS Danger.fsm by the LAMBS Dev Team)"
mainprefix = "z"

[version]
path = "addons/main/script_version.hpp"
git_hash = 0

[files]
include = [
    "mod.cpp",
    "*.paa",
    "LICENSE",
    "readme.txt",
    "readme.md"
]

[hemtt.signing]
authority = "hostis"

[hemtt.release]
folder = "hostis"

[hemtt.launch.default]
workshop = [
    "450814997", # CBA_A3's Workshop ID
    "463939057", # ACE3's Workshop ID
    "1779063631", # Zeus Enhanced (ZEN) Workshop ID
]

parameters = [
    "-world=empty",
    "-filePatching",
]