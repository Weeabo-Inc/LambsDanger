# HOSTIS is a modified version of LAMBS Danger.fsm. The PBO prefix stays "lambs" so
# that config and stringtable paths in the compatibility addons keep resolving
# (docs/adr/0002-fork-identity-and-addon-naming.md). New hostis_* addons set their
# own PREFIX in script_mod.hpp.
name = "HOSTIS"
prefix = "lambs"
author = "bluefield-creator (fork of LAMBS Danger.fsm by the LAMBS Dev Team)"
mainprefix = "z"

[version]
path = "addons/main/script_version.hpp"
git_hash = 0

[files]
include = [
    "mod.cpp",
    "*.paa",
    "LICENSE",
    "readme.txt",
    "readme.md"
]

[hemtt.signing]
authority = "hostis"

[hemtt.release]
folder = "hostis"

[hemtt.launch.default]
workshop = [
    "450814997", # CBA_A3's Workshop ID
    "463939057", # ACE3's Workshop ID
    "1779063631", # Zeus Enhanced (ZEN) Workshop ID
]

parameters = [
    "-world=empty",
    "-filePatching",
]